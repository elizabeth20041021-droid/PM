<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗盤記錄</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    padding: 16px;
    font-size: 14px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .sub { font-size: 12px; color: #86868b; margin-bottom: 14px; }

  .bar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: #fff; border-radius: 10px; padding: 10px 12px;
    margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .btn {
    padding: 6px 12px; border-radius: 7px; border: 1px solid #d2d2d7;
    background: #fff; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  .btn:hover { background: #f0f0f2; }
  .btn.primary { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
  .btn.green { background: #34c759; color: #fff; border-color: #34c759; }
  .btn.red { background: #ff3b30; color: #fff; border-color: #ff3b30; }
  .btn.blue { background: #0071e3; color: #fff; border-color: #0071e3; }
  input[type="date"], input[type="text"], input[type="number"], input[type="time"] {
    padding: 6px 10px; border: 1px solid #d2d2d7; border-radius: 7px; font-size: 13px;
  }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 20px;
    background: #f0f0f2; color: #86868b;
  }
  .badge.on { background: #d1f0d9; color: #1a7f37; }
  .badge.warn { background: #fff3cd; color: #856404; }

  .card {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }

  .stock-block {
    margin-bottom: 32px;
    background: #fff;
    border-radius: 8px;
    padding: 12px 8px 8px;
  }
  .stock-title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .stock-actions { text-align: right; margin-bottom: 6px; }
  .stock-actions .btn { font-size: 12px; padding: 3px 8px; }

  table.gm {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    border: 1.5px solid #222;
  }
  table.gm th, table.gm td {
    border: 1px solid #333;
    padding: 6px 5px;
    text-align: center;
  }
  table.gm th {
    background: #f0f0f0;
    font-weight: 600;
    font-size: 12px;
  }
  table.gm td input {
    width: 100%;
    border: none;
    text-align: center;
    font-size: 13px;
    background: transparent;
    padding: 1px 0;
  }
  table.gm td input:focus {
    outline: 2px solid #0071e3;
    background: #f0f7ff;
  }
  .diff-up { color: #1a7f37; font-weight: 700; }
  .diff-down { color: #d70015; font-weight: 700; }
  .time-col { width: 62px; background: #fafafa; font-weight: 500; }

  .log {
    font-size: 12px; color: #86868b; max-height: 120px; overflow-y: auto;
    background: #fafafa; border-radius: 6px; padding: 6px 10px; margin-top: 8px;
  }
  .empty { text-align: center; color: #86868b; padding: 24px; font-size: 13px; }
  #jsonFile { display: none; }
  .tip { font-size: 12px; color: #0071e3; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>暗盤記錄</h1>
  <div class="sub" id="clock">—</div>

  <div class="bar">
    <input type="date" id="datePick">
    <button class="btn" onclick="changeDay(-1)">上一日</button>
    <button class="btn primary" onclick="updateQuote()">準備下一時間點</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">啟動定時</button>
    
    <button class="btn green" onclick="document.getElementById('jsonFile').click()">匯入 JSON</button>
    <button class="btn blue" onclick="pasteJSON()">貼上 JSON</button>
    <input type="file" id="jsonFile" accept=".json" onchange="importJSON(event)">
    
    <button class="btn" onclick="exportExcel()">匯出 Excel</button>
    <button class="btn" onclick="exportPNG()">匯出 PNG</button>
    <button class="btn red" onclick="clearDay()">清除今日</button>
    <span class="badge" id="status">已停止</span>
  </div>

  <div class="card">
    <h2>操作說明（自動化流程）</h2>
    <div class="log" id="log">
      <b>推薦流程：</b><br>
      1. 安裝 Tampermonkey → 安裝「AAStocks 暗盤一鍵匯出」腳本<br>
      2. 打開 <a href="https://www.aastocks.com/tc/stocks/market/ipo/greymarket.aspx" target="_blank">AAStocks 暗盤頁</a><br>
      3. 在暗盤頁按「一鍵複製 JSON」或 <b>Ctrl + Shift + G</b><br>
      4. 回到本頁點藍色「貼上 JSON」→ 資料自動填入<br>
      5. 可啟動「定時」在 16:15–18:30 自動準備空欄位<br><br>
      目前時間狀態會顯示在下方。
    </div>
    <div class="tip" id="sessionTip">—</div>
  </div>

  <div class="card">
    <h2>人手加入股票</h2>
    <div style="display:flex;gap:8px;">
      <input type="text" id="symInput" placeholder="例如：09941 或 09941,03625" style="flex:1;">
      <button class="btn primary" onclick="addSymbols()">加入</button>
    </div>
  </div>

  <div id="tables"></div>
</div>

<script>
const TIMES = ['16:20','16:50','17:20','17:50','18:20','18:30'];
let store = {};
function load() {
  try { store = JSON.parse(localStorage.getItem('gm_v5') || '{}'); } catch(e) { store = {}; }
}
function save() {
  try { localStorage.setItem('gm_v5', JSON.stringify(store)); } catch(e) {}
}
load();

function today() { return new Date().toISOString().slice(0,10); }
function key() { return document.getElementById('datePick').value || today(); }
function log(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString('zh-HK',{hour12:false});
  el.innerHTML = `[${t}] ${msg}<br>` + el.innerHTML;
}
function clock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString('zh-HK',{hour12:false}) + '  香港時間';
  const hm = now.toTimeString().slice(0,5);
  const tip = document.getElementById('sessionTip');
  if (hm >= '16:15' && hm <= '18:30') {
    tip.textContent = '✅ 目前在暗盤交易時段 (16:15–18:30)，適合抓取即時報價';
    tip.style.color = '#1a7f37';
  } else {
    tip.textContent = '⏳ 目前不在暗盤時段，資料可能為收盤後最後一筆';
    tip.style.color = '#856404';
  }
}
setInterval(clock, 1000); clock();

document.getElementById('datePick').value = today();
document.getElementById('datePick').onchange = render;

function ensure(d) {
  if (!store[d]) store[d] = {};
  return store[d];
}

function addSymbols() {
  const raw = document.getElementById('symInput').value;
  const list = raw.split(/[,，\s]+/).map(s => s.trim().replace(/\.HK$/i,'')).filter(Boolean);
  const day = ensure(key());
  list.forEach(s => {
    if (!day[s]) {
      day[s] = {};
      TIMES.forEach(t => day[s][t] = { fTO:'', pTO:'', fP:'', pP:'' });
    }
  });
  save();
  document.getElementById('symInput').value = '';
  render();
  log('已加入：' + list.join(', '));
}

function calcDiff(a, b) {
  if (a === '' || b === '' || isNaN(+a) || isNaN(+b)) return { val: '—', cls: '' };
  const d = (+a - +b).toFixed(2);
  return { val: d, cls: +d >= 0 ? 'diff-up' : 'diff-down' };
}

function render() {
  const d = key();
  const day = store[d] || {};
  const box = document.getElementById('tables');
  box.innerHTML = '';
  const syms = Object.keys(day).sort();
  if (!syms.length) {
    box.innerHTML = '<div class="card empty">今日尚無股票<br>請匯入 JSON 或手動加入</div>';
    return;
  }

  syms.forEach(sym => {
    const data = day[sym];
    let html = `
      <div class="stock-block" id="block_${sym}">
        <div class="stock-title">${sym}.HK</div>
        <div class="stock-actions">
          <button class="btn" onclick="fillNext('${sym}')">填下一時間</button>
          <button class="btn" onclick="delSym('${sym}')">刪除</button>
        </div>
        <table class="gm">
          <thead>
            <tr>
              <th rowspan="2" class="time-col">Time</th>
              <th colspan="3">Turnover (M)</th>
              <th colspan="3">Price (HKD)</th>
            </tr>
            <tr>
              <th>Futu</th><th>Phillip</th><th>Diff</th>
              <th>Futu</th><th>Phillip</th><th>Diff</th>
            </tr>
          </thead>
          <tbody>`;
    TIMES.forEach(t => {
      const r = data[t] || { fTO:'', pTO:'', fP:'', pP:'' };
      const toD = calcDiff(r.fTO, r.pTO);
      const pD  = calcDiff(r.fP, r.pP);
      html += `
        <tr>
          <td class="time-col">${t}</td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="fTO" value="${r.fTO}" oninput="onEdit(this)"></td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="pTO" value="${r.pTO}" oninput="onEdit(this)"></td>
          <td class="${toD.cls}" id="to_${sym}_${t}">${toD.val}</td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="fP" value="${r.fP}" oninput="onEdit(this)"></td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="pP" value="${r.pP}" oninput="onEdit(this)"></td>
          <td class="${pD.cls}" id="p_${sym}_${t}">${pD.val}</td>
        </tr>`;
    });
    html += `</tbody></table></div>`;
    box.insertAdjacentHTML('beforeend', html);
  });
}

function onEdit(el) {
  const sym = el.dataset.sym, t = el.dataset.t, f = el.dataset.f;
  const day = ensure(key());
  if (!day[sym]) day[sym] = {};
  if (!day[sym][t]) day[sym][t] = { fTO:'', pTO:'', fP:'', pP:'' };
  day[sym][t][f] = el.value.trim();
  save();
  const r = day[sym][t];
  const toD = calcDiff(r.fTO, r.pTO);
  const pD  = calcDiff(r.fP, r.pP);
  const toEl = document.getElementById(`to_${sym}_${t}`);
  const pEl  = document.getElementById(`p_${sym}_${t}`);
  if (toEl) { toEl.textContent = toD.val; toEl.className = toD.cls; }
  if (pEl)  { pEl.textContent  = pD.val;  pEl.className  = pD.cls; }
}

function delSym(sym) {
  const d = key();
  if (store[d]) { delete store[d][sym]; save(); render(); }
}

function changeDay(n) {
  const d = new Date(document.getElementById('datePick').value);
  d.setDate(d.getDate() + n);
  document.getElementById('datePick').value = d.toISOString().slice(0,10);
  render();
}

function getNextEmpty(sym) {
  const data = (ensure(key())[sym] || {});
  for (const t of TIMES) {
    const r = data[t];
    if (!r || (r.fTO==='' && r.pTO==='' && r.fP==='' && r.pP==='')) return t;
  }
  return null;
}

function fillNext(sym) {
  const t = getNextEmpty(sym);
  if (!t) { log(sym + ' 已全部填滿'); return; }
  const day = ensure(key());
  if (!day[sym]) day[sym] = {};
  day[sym][t] = { fTO:'', pTO:'', fP:'', pP:'' };
  save(); render();
  log(`${sym} 已準備 ${t}`);
}

function updateQuote() {
  const day = store[key()] || {};
  const syms = Object.keys(day);
  if (!syms.length) {
    document.getElementById('symInput').value = '09941';
    addSymbols();
    return;
  }
  let n = 0;
  syms.forEach(sym => {
    const t = getNextEmpty(sym);
    if (t) { day[sym][t] = { fTO:'', pTO:'', fP:'', pP:'' }; n++; }
  });
  save(); render();
  log(n ? `已準備 ${n} 個時間點（請用 AAStocks 腳本複製後貼上）` : '全部時間點已填滿');
}

let timer = null, runs = 0;
function toggleAuto() {
  const btn = document.getElementById('autoBtn');
  const st  = document.getElementById('status');
  if (timer) {
    clearInterval(timer); timer = null;
    btn.textContent = '啟動定時';
    st.textContent = '已停止'; st.className = 'badge';
    log('定時已停止');
    return;
  }
  runs = 0;
  btn.textContent = '停止定時';
  st.textContent = '運行中'; st.className = 'badge on';
  log(`定時啟動（每 30 分鐘準備下一空欄）`);
  const tick = () => {
    const now = new Date().toTimeString().slice(0,5);
    if (now < '16:15' || now > '18:30') return;
    runs++;
    updateQuote();
  };
  tick();
  timer = setInterval(tick, 30 * 60000);
}

function clearDay() {
  if (!confirm('確定清除今日全部資料？')) return;
  delete store[key()];
  save(); render();
  log('已清除');
}

function exportExcel() {
  const d = key();
  const day = store[d] || {};
  let csv = '股票,時間,Futu成交(M),Phillip成交(M),成交Diff,Futu價,Phillip價,價格Diff\n';
  Object.keys(day).forEach(s => {
    TIMES.forEach(t => {
      const r = day[s][t] || {};
      const td = calcDiff(r.fTO, r.pTO).val;
      const pd = calcDiff(r.fP, r.pP).val;
      csv += `${s}.HK,${t},${r.fTO||''},${r.pTO||''},${td},${r.fP||''},${r.pP||''},${pd}\n`;
    });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'}));
  a.download = `暗盤_${d}.csv`;
  a.click();
  log('已匯出 Excel');
}

async function exportPNG() {
  document.querySelectorAll('.stock-actions').forEach(el => el.style.display = 'none');
  try {
    const canvas = await html2canvas(document.getElementById('tables'), {
      scale: 2, backgroundColor: '#ffffff', useCORS: true
    });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `暗盤_${key()}.png`;
    a.click();
    log('已匯出 PNG');
  } catch(e) { alert('匯出失敗'); }
  document.querySelectorAll('.stock-actions').forEach(el => el.style.display = '');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      let stocks = data.stocks || data;
      let targetDate = data.date || key();
      if (data.date && data.stocks) {
        stocks = data.stocks;
        targetDate = data.date;
      }
      document.getElementById('datePick').value = targetDate;
      const day = ensure(targetDate);
      let count = 0;
      for (const [sym, times] of Object.entries(stocks)) {
        const cleanSym = sym.replace(/\.HK$/i, '');
        if (!day[cleanSym]) day[cleanSym] = {};
        for (const [t, values] of Object.entries(times)) {
          if (TIMES.includes(t)) {
            day[cleanSym][t] = {
              fTO: values.fTO || values.futuTO || '',
              pTO: values.pTO || values.phillipTO || '',
              fP:  values.fP  || values.futuP  || '',
              pP:  values.pP  || values.phillipP  || ''
            };
            count++;
          }
        }
      }
      save();
      render();
      log(`成功匯入！共 ${count} 筆資料（日期 ${targetDate}）`);
      event.target.value = '';
    } catch (err) {
      alert('JSON 格式錯誤：' + err.message);
      log('匯入失敗');
    }
  };
  reader.readAsText(file);
}

// 新增：從剪貼簿貼上 JSON
async function pasteJSON() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text || !text.trim().startsWith('{')) {
      alert('剪貼簿沒有有效的 JSON 資料\n請先在 AAStocks 頁面按「一鍵複製 JSON」');
      return;
    }

    const blob = new Blob([text], { type: 'application/json' });
    const file = new File([blob], 'paste.json', { type: 'application/json' });

    const fakeEvent = {
      target: {
        files: [file],
        value: ''
      }
    };

    importJSON(fakeEvent);
  } catch (err) {
    console.error(err);
    alert('無法讀取剪貼簿：' + err.message + '\n\n可能原因：\n1. 還沒允許網站存取剪貼簿\n2. 剪貼簿是空的');
  }
}

render();
</script>
</body>
</html>

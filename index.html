<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗盤記錄</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    padding: 16px;
    font-size: 14px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .sub { font-size: 12px; color: #86868b; margin-bottom: 14px; }

  /* 頂部工具列 */
  .bar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: #fff; border-radius: 10px; padding: 10px 12px;
    margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .btn {
    padding: 6px 12px; border-radius: 7px; border: 1px solid #d2d2d7;
    background: #fff; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  .btn:hover { background: #f0f0f2; }
  .btn.primary { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
  .btn.primary:hover { background: #333; }
  .btn.red { background: #ff3b30; color: #fff; border-color: #ff3b30; }
  input[type="date"], input[type="text"], input[type="number"], input[type="time"] {
    padding: 6px 10px; border: 1px solid #d2d2d7; border-radius: 7px; font-size: 13px;
  }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 20px;
    background: #f0f0f2; color: #86868b;
  }
  .badge.on { background: #d1f0d9; color: #1a7f37; }

  /* 卡片 */
  .card {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }

  /* 股票標題 */
  .stock-head {
    display: flex; justify-content: space-between; align-items: center;
    margin: 18px 0 6px;
  }
  .stock-head b { font-size: 16px; }

  /* 表格（對齊圖三） */
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    border: 1px solid #d2d2d7;
  }
  th, td {
    border: 1px solid #d2d2d7; padding: 6px 8px; text-align: center;
  }
  th { background: #fafafa; font-weight: 600; font-size: 12px; color: #555; }
  td input {
    width: 100%; border: none; text-align: center; font-size: 13px;
    background: transparent; padding: 2px 0;
  }
  td input:focus { outline: 2px solid #0071e3; background: #f0f7ff; }
  .diff-up { color: #34c759; font-weight: 600; }
  .diff-down { color: #ff3b30; font-weight: 600; }
  .time-col { width: 70px; background: #fafafa; font-weight: 500; }
  .adj { width: 70px; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .label { font-size: 11px; color: #86868b; margin-bottom: 3px; }
  .log {
    font-size: 12px; color: #86868b; max-height: 70px; overflow-y: auto;
    background: #fafafa; border-radius: 6px; padding: 6px 10px; margin-top: 8px;
  }
  .empty { text-align: center; color: #86868b; padding: 24px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>暗盤記錄</h1>
  <div class="sub" id="clock">—</div>

  <!-- 工具列 -->
  <div class="bar">
    <input type="date" id="datePick">
    <button class="btn" onclick="changeDay(-1)">上一步</button>
    <button class="btn primary" onclick="updateQuote()">更新報價</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">啟動定時</button>
    <button class="btn" onclick="exportCSV()">匯出 CSV</button>
    <button class="btn red" onclick="clearDay()">清除今日</button>
    <span class="badge" id="status">已停止</span>
  </div>

  <!-- 定時設定 -->
  <div class="card">
    <h2>定時設定</h2>
    <div class="grid">
      <div>
        <div class="label">刷新間隔（分鐘）</div>
        <input type="number" id="interval" value="30" min="5" max="60" style="width:100%">
      </div>
      <div>
        <div class="label">最大次數（0=跑到結束）</div>
        <input type="number" id="maxRun" value="0" min="0" style="width:100%">
      </div>
      <div>
        <div class="label">開始時間</div>
        <input type="time" id="startT" value="16:15" style="width:100%">
      </div>
      <div>
        <div class="label">結束時間</div>
        <input type="time" id="endT" value="18:30" style="width:100%">
      </div>
    </div>
    <div class="log" id="log">準備就緒。時間點固定為 16:20 / 16:50 / 17:20 / 17:50 / 18:20 / 18:30</div>
  </div>

  <!-- 手動加入 -->
  <div class="card">
    <h2>人手加入股票</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="text" id="symInput" placeholder="例如：09941,7672,9917" style="flex:1;min-width:200px">
      <button class="btn primary" onclick="addSymbols()">加入</button>
    </div>
    <p style="font-size:12px;color:#86868b;margin-top:8px">
      今日 aastocks 顯示有暗盤：<b>09941.HK（先通醫藥－Ｂ）</b>。可先加入此代號。
    </p>
  </div>

  <!-- 表格區 -->
  <div id="tables"></div>
</div>

<script>
const TIMES = ['16:20','16:50','17:20','17:50','18:20','18:30'];

// 安全儲存
let store = {};
function load() {
  try { store = JSON.parse(localStorage.getItem('gm_v3') || '{}'); } catch(e) { store = {}; }
}
function save() {
  try { localStorage.setItem('gm_v3', JSON.stringify(store)); } catch(e) {}
}
load();

function today() { return new Date().toISOString().slice(0,10); }
function key() { return document.getElementById('datePick').value || today(); }
function log(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString('zh-HK',{hour12:false});
  el.innerHTML = `[${t}] ${msg}<br>` + el.innerHTML;
}
function clock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleString('zh-HK',{hour12:false}) + '  香港時間';
}
setInterval(clock, 1000); clock();

document.getElementById('datePick').value = today();
document.getElementById('datePick').onchange = render;

// ===== 資料結構 =====
function ensure(d) {
  if (!store[d]) store[d] = {};
  return store[d];
}

function addSymbols() {
  const raw = document.getElementById('symInput').value;
  const list = raw.split(/[,，\s]+/).map(s => s.trim().replace(/\.HK$/i,'')).filter(Boolean);
  const day = ensure(key());
  list.forEach(s => {
    if (!day[s]) {
      day[s] = {};
      TIMES.forEach(t => day[s][t] = { fTO:'', pTO:'', fP:'', pP:'' });
    }
  });
  save();
  document.getElementById('symInput').value = '';
  render();
  log('已加入：' + list.join(', '));
}

// ===== 渲染（對齊圖三表格）=====
function render() {
  const d = key();
  const day = store[d] || {};
  const box = document.getElementById('tables');
  box.innerHTML = '';

  const syms = Object.keys(day).sort();
  if (!syms.length) {
    box.innerHTML = '<div class="card empty">今日尚無股票<br>請先在上方加入代號（例如 09941）</div>';
    return;
  }

  syms.forEach(sym => {
    const data = day[sym];
    let html = `
      <div class="stock-head">
        <b>${sym}.HK</b>
        <div>
          <button class="btn" style="font-size:12px;padding:4px 8px" onclick="fillNext('${sym}')">填下一時間</button>
          <button class="btn" style="font-size:12px;padding:4px 8px" onclick="delSym('${sym}')">刪除</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th rowspan="2" class="time-col">Time</th>
            <th colspan="3">Turnover</th>
            <th colspan="3">Price (HKD)</th>
            <th rowspan="2" class="adj">調整</th>
          </tr>
          <tr>
            <th>Futu(M)</th><th>Phillip(M)</th><th>Diff(M)</th>
            <th>Futu</th><th>Phillip</th><th>Diff</th>
          </tr>
        </thead>
        <tbody>`;

    TIMES.forEach(t => {
      const r = data[t] || { fTO:'', pTO:'', fP:'', pP:'' };
      const toDiff = calcDiff(r.fTO, r.pTO);
      const pDiff  = calcDiff(r.fP, r.pP);
      html += `
        <tr>
          <td class="time-col">${t}</td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="fTO" value="${r.fTO}" oninput="onEdit(this)"></td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="pTO" value="${r.pTO}" oninput="onEdit(this)"></td>
          <td class="${toDiff.cls}" id="to_${sym}_${t}">${toDiff.val}</td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="fP" value="${r.fP}" oninput="onEdit(this)"></td>
          <td><input data-sym="${sym}" data-t="${t}" data-f="pP" value="${r.pP}" oninput="onEdit(this)"></td>
          <td class="${pDiff.cls}" id="p_${sym}_${t}">${pDiff.val}</td>
          <td>
            <button class="btn" style="padding:2px 6px;font-size:11px" onclick="clearRow('${sym}','${t}')">清</button>
          </td>
        </tr>`;
    });
    html += '</tbody></table>';
    box.insertAdjacentHTML('beforeend', html);
  });
}

function calcDiff(a, b) {
  if (a === '' || b === '' || isNaN(a) || isNaN(b)) return { val: '—', cls: '' };
  const d = (+a - +b).toFixed(2);
  return { val: d, cls: d >= 0 ? 'diff-up' : 'diff-down' };
}

function onEdit(el) {
  const sym = el.dataset.sym;
  const t   = el.dataset.t;
  const f   = el.dataset.f;
  const day = ensure(key());
  if (!day[sym]) day[sym] = {};
  if (!day[sym][t]) day[sym][t] = { fTO:'', pTO:'', fP:'', pP:'' };
  day[sym][t][f] = el.value;
  save();

  // 即時更新 Diff
  const r = day[sym][t];
  const toD = calcDiff(r.fTO, r.pTO);
  const pD  = calcDiff(r.fP, r.pP);
  const toEl = document.getElementById(`to_${sym}_${t}`);
  const pEl  = document.getElementById(`p_${sym}_${t}`);
  if (toEl) { toEl.textContent = toD.val; toEl.className = toD.cls; }
  if (pEl)  { pEl.textContent  = pD.val;  pEl.className  = pD.cls; }
}

function clearRow(sym, t) {
  const day = ensure(key());
  if (day[sym]) day[sym][t] = { fTO:'', pTO:'', fP:'', pP:'' };
  save();
  render();
}

function delSym(sym) {
  const d = key();
  if (store[d]) { delete store[d][sym]; save(); render(); }
}

function changeDay(n) {
  const d = new Date(document.getElementById('datePick').value);
  d.setDate(d.getDate() + n);
  document.getElementById('datePick').value = d.toISOString().slice(0,10);
  render();
}

// ===== 更新報價：自動填下一個空白時間點 =====
function getNextEmpty(sym) {
  const day = ensure(key());
  const data = day[sym] || {};
  for (const t of TIMES) {
    const r = data[t];
    if (!r || (r.fTO === '' && r.pTO === '' && r.fP === '' && r.pP === '')) return t;
  }
  return null;
}

function fillNext(sym) {
  const t = getNextEmpty(sym);
  if (!t) {
    log(sym + ' 所有時間點已填滿');
    return;
  }
  // 給空白列，方便使用者直接輸入
  const day = ensure(key());
  if (!day[sym]) day[sym] = {};
  day[sym][t] = { fTO:'', pTO:'', fP:'', pP:'' };
  save();
  render();
  log(`${sym} 已準備 ${t} 時間點，請直接輸入數字`);
}

function updateQuote() {
  const d = key();
  const day = store[d] || {};
  const syms = Object.keys(day);
  if (!syms.length) {
    // 自動加入今日已知股票
    document.getElementById('symInput').value = '09941';
    addSymbols();
    log('已自動加入今日暗盤股票 09941');
    return;
  }
  let filled = 0;
  syms.forEach(sym => {
    const t = getNextEmpty(sym);
    if (t) {
      day[sym][t] = { fTO:'', pTO:'', fP:'', pP:'' };
      filled++;
    }
  });
  save();
  render();
  if (filled) log(`已為 ${filled} 隻股票準備下一個時間點，請輸入數字`);
  else log('所有時間點已填滿');
}

// ===== 定時 =====
let timer = null, runs = 0;
function toggleAuto() {
  const btn = document.getElementById('autoBtn');
  const st  = document.getElementById('status');
  if (timer) {
    clearInterval(timer); timer = null;
    btn.textContent = '啟動定時';
    st.textContent = '已停止'; st.className = 'badge';
    log('定時已停止');
    return;
  }
  const mins = +document.getElementById('interval').value || 30;
  const max  = +document.getElementById('maxRun').value;
  runs = 0;
  btn.textContent = '停止定時';
  st.textContent = '運行中'; st.className = 'badge on';
  log(`定時啟動，每 ${mins} 分鐘推進一次時間點`);

  const tick = () => {
    const now = new Date().toTimeString().slice(0,5);
    const s = document.getElementById('startT').value;
    const e = document.getElementById('endT').value;
    if (now < s || now > e) { log('非暗盤時段，跳過'); return; }
    if (max > 0 && runs >= max) { toggleAuto(); return; }
    runs++;
    updateQuote();
  };
  tick();
  timer = setInterval(tick, mins * 60000);
}

function clearDay() {
  if (!confirm('確定清除今日全部資料？')) return;
  delete store[key()];
  save();
  render();
  log('已清除今日');
}

function exportCSV() {
  const d = key();
  const day = store[d] || {};
  let csv = '股票,時間,Futu成交,Phillip成交,成交Diff,Futu價,Phillip價,價格Diff\n';
  Object.keys(day).forEach(s => {
    TIMES.forEach(t => {
      const r = day[s][t] || {};
      const td = calcDiff(r.fTO, r.pTO).val;
      const pd = calcDiff(r.fP, r.pP).val;
      csv += `${s}.HK,${t},${r.fTO||''},${r.pTO||''},${td},${r.fP||''},${r.pP||''},${pd}\n`;
    });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv'}));
  a.download = `暗盤_${d}.csv`;
  a.click();
  log('已匯出 CSV');
}

// 啟動
render();
</script>
</body>
</html>
